# PMR446 – 16 analog channels, 12.5 kHz step.
library: cz/pmr446
title: "PMR446 (16 channels)"
country: CZ
source: "ČTÚ general authorisation VO-R/3/6.2016-9 (check the current version on ctu.gov.cz)"
legal:
  tx: restricted
  max_power_w: 0.5
  note: >
    Max. 0.5 W e.r.p. and only equipment with a fixed (non-removable)
    antenna. Handhelds with a removable antenna and a lowest power of
    ~1 W (RT-950 Pro, RT-900, UV-K5) do not meet these conditions – only
    listening is safe. Profiles import PMR446 receive only; switching TX on
    (--tx on) is at your own responsibility.
defaults: {mode: FM, bw: narrow, power: low, rx_tone: off, tx_tone: off, scan: true}
