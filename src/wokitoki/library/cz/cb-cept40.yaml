# CB 27 MHz – channels 1–40 (CEPT). The order of 23/24/25 is irregular on purpose.
library: cz/cb-cept40
title: "CB – 40 CEPT channels"
country: CZ
source: "ČTÚ general authorisation VO-R/7/11.2016-12 (check the current version on ctu.gov.cz)"
legal:
  tx: allowed
  max_power_w: 4          # FM/AM 4 W e.r.p., SSB 12 W PEP (channels 1–40)
  note: >
    The Radtel RT-950 Pro transmits only FM on 27 MHz (3–4 W); the channels
    are shown only with Work Band 18–64 MHz or in section C in All Band mode.
defaults: {mode: FM, bw: narrow, power: mid, rx_tone: off, tx_tone: off, scan: true}
