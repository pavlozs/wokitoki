name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - run: wokitoki --plain radios   # the CLI starts and finds its drivers

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: libraries and profiles are packaged
        run: |
          unzip -l dist/*.whl | grep -q 'wokitoki/library/cz/pmr446.yaml'
          unzip -l dist/*.whl | grep -q 'wokitoki/profiles/cz/radtel-rt900.yaml'
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
